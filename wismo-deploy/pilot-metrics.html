<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCENTS/WISMO Pilot Metrics</title>
<style>
  :root{--bg:#0A1A2F;--panel:#0E1B2E;--panel2:#0F2236;--teal:#0E7490;--teal-dk:#0B5563;--teal-lt:#19A0BF;--amber:#E8B85D;--ink:#EAF1F7;--muted:#8FA3B8;--line:#1C2E44;--green:#28C840;--red:#FF5F57;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 22px 60px}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:.02em}
  .brand b{color:var(--teal-lt)}
  .spacer{flex:1}
  .pill{font-family:var(--mono);font-size:12px;color:var(--green);background:rgba(40,200,64,.16);border:1px solid rgba(40,200,64,.3);padding:6px 12px;border-radius:20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px}
  .kpi .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
  .kpi .s{font-size:11.5px;font-weight:600;margin-top:4px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .card h3{font-size:14.5px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 12px 10px 0;border-bottom:1px solid var(--line)}
  td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .oid{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px}
  .b-teal{background:rgba(14,116,144,.2);color:var(--teal-lt)}
  .b-green{background:rgba(40,200,64,.18);color:var(--green)}
  .b-red{background:rgba(255,95,87,.18);color:var(--red)}
  .btn{background:linear-gradient(135deg,var(--teal),var(--teal-dk));color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  @media(max-width:860px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">SCENTS / <b>WISMO</b> Pilot Metrics</div>
    <div class="spacer"></div>
    <button class="btn" onclick="reload()">Refresh</button>
  </div>

  <div class="grid">
    <div class="kpi"><div class="l">Pilot users</div><div class="v" id="kUsers">—</div><div class="s">tenants active</div></div>
    <div class="kpi"><div class="l">Orders</div><div class="v" id="kOrders">—</div><div class="s">last 7 days</div></div>
    <div class="kpi"><div class="l">Delivery rate</div><div class="v" id="kRate">—</div><div class="s">success / total</div></div>
    <div class="kpi"><div class="l">Incidents</div><div class="v" id="kInc">—</div><div class="s">open + monitoring</div></div>
  </div>

  <div class="card">
    <h3>Recent orders</h3>
    <table>
      <thead><tr><th>Order</th><th>Merchant</th><th>Rider</th><th>Status</th><th>Value</th></tr></thead>
      <tbody id="ordersBody"><tr><td colspan="5" style="color:var(--muted)">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Open incidents</h3>
    <table>
      <thead><tr><th>Incident</th><th>Order</th><th>Type</th><th>Status</th><th>Age</th></tr></thead>
      <tbody id="incBody"><tr><td colspan="5" style="color:var(--muted)">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const BASE = '';
async function api(path){ const r = await fetch(BASE + path); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function reload(){
  const token = 'pilot-token';
  try{
    const orders = await api('/api/orders');
    const incs = await api('/api/incidents');
    document.getElementById('kOrders').textContent = orders.data ? orders.data.length : 0;
    const delivered = (orders.data || []).filter(o=>o.status==='delivered').length;
    const rate = orders.data && orders.data.length ? Math.round(delivered/orders.data.length*100) : 0;
    document.getElementById('kRate').textContent = rate + '%';
    const open = (incs.data || []).filter(i=>i.status==='open' || i.status==='monitoring').length;
    document.getElementById('kInc').textContent = open;
    document.getElementById('kUsers').textContent = '1';
    renderOrders(orders.data || []);
    renderIncidents(incs.data || []);
  }catch(e){ console.error(e); }
}
function renderOrders(list){
  const tbody = document.getElementById('ordersBody');
  tbody.innerHTML = list.slice(0,20).map(o=>`<tr>
    <td class="oid">${o.order_id||''}</td>
    <td>${o.merchant_id||''}</td>
    <td>${o.rider_id||'—'}</td>
    <td><span class="badge ${statusClass(o.status)}">${o.status||''}</span></td>
    <td>KES ${Number(o.value||0).toLocaleString()}</td>
  </tr>`).join('') || '<tr><td colspan="5" style="color:var(--muted)">No orders</td></tr>';
}
function renderIncidents(list){
  const tbody = document.getElementById('incBody');
  tbody.innerHTML = list.slice(0,20).map(i=>`<tr>
    <td class="oid">${i.incident_id||''}</td>
    <td>${i.order_id||'—'}</td>
    <td>${i.type||''}</td>
    <td><span class="badge ${statusClass(i.status)}">${i.status||''}</span></td>
    <td style="color:var(--muted)">${i.ts ? new Date(i.ts*1000).toLocaleString() : '—'}</td>
  </tr>`).join('') || '<tr><td colspan="5" style="color:var(--muted)">No incidents</td></tr>';
}
function statusClass(s){
  if(s==='delivered' || s==='resolved') return 'b-green';
  if(s==='open' || s==='cancelled') return 'b-red';
  return 'b-teal';
}
reload();
</script>
</body>
</html>
