[loggers]
keys=root,scents,wismo,gunicorn

[handlers]
keys=console,file,error

[formatters]
keys=json,standard

[logger_root]
level=INFO
handlers=console

[logger_scents]
level=INFO
handlers=console,file,error
qualname=scents
propagate=0

[logger_wismo]
level=INFO
handlers=console,file
qualname=wismo
propagate=0

[logger_gunicorn]
level=INFO
handlers=console
qualname=gunicorn.error
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=INFO
formatter=json
args=('/app/logs/scents.log', 'a', 10485760, 10)

[handler_error]
class=handlers.RotatingFileHandler
level=ERROR
formatter=json
args=('/app/logs/scents-error.log', 'a', 10485760, 5)

[formatter_standard]
format=%(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_json]
format=%(message)s
datefmt=
